name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatting, type, and coverage checks
        run: pnpm quality:check

      - name: Build demo and enforce its bundle budget
        run: pnpm demo:build

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tarball contents, metadata, and exports
        run: pnpm package:inspect

  consumers:
    name: Consumer smoke / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Core only / Node 20 minimum
            node: '20.19.0'
            arguments: --profile=core-min
          - label: Core only / Node 26 current
            node: '26'
            arguments: --profile=core-current
          - label: React 18 + AntD 6 + TS 5.4 minimum
            node: '20.19.0'
            arguments: --profile=react18-min
          - label: React 18 current
            node: '24'
            arguments: --profile=react18-current
          - label: React 19 + AntD 6 + TS 5.4 minimum
            node: '20.19.0'
            arguments: --profile=react19-min
          - label: React 19 + TS 7 current + packed Vite
            node: '24'
            arguments: --profile=react19-current --with-vite
          - label: Core only / npm tarball install
            node: '24'
            arguments: --profile=core-min --manager=npm
          - label: React 19 / npm tarball + packed Vite
            node: '24'
            arguments: --profile=react19-current --with-vite --manager=npm
          - label: React 19 / packed Vite + Chromium
            node: '24'
            arguments: --profile=react19-current --with-vite --with-browser
            browser: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Install Chromium for the real-browser consumer
        if: ${{ matrix.browser == true }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Install and test packed consumer
        run: pnpm consumer:smoke -- ${{ matrix.arguments }}
