name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish trusted release
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: npm
      url: https://www.npmjs.com/package/@huiyun/data-grid
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies without lockfile changes
        run: pnpm install --frozen-lockfile

      - name: Require an OIDC-capable npm CLI
        run: node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) throw new Error('npm 11.5.1 or newer is required');" "$(npm --version)"

      - name: Require release commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Verify release identity
        id: release
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"

      - name: Run the complete release gate
        run: pnpm release:check

      - name: Publish with npm trusted publishing
        run: npm publish --access public --ignore-scripts --tag "${{ steps.release.outputs.dist-tag }}"
