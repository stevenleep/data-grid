name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package release
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      package-file: ${{ steps.package.outputs.package-file }}
      package-sha256: ${{ steps.package.outputs.package-sha256 }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without lockfile changes
        run: pnpm install --frozen-lockfile

      - name: Require release commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Verify release identity
        id: release
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"

      - name: Install Chromium for the release consumer gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the complete release gate
        run: pnpm release:check

      - name: Pack the verified npm artifact
        id: package
        shell: bash
        run: |
          package_file="huiyun-data-grid-${GITHUB_REF_NAME#v}.tgz"
          artifact_name="npm-package-${GITHUB_REF_NAME}"
          pnpm pack --out "$RUNNER_TEMP/$package_file"
          cd "$RUNNER_TEMP"
          package_sha256="$(sha256sum "$package_file" | awk '{print $1}')"
          printf '%s  %s\n' "$package_sha256" "$package_file" > "$package_file.sha256"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "package-file=$package_file" >> "$GITHUB_OUTPUT"
          echo "package-sha256=$package_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.package-file }}
            ${{ runner.temp }}/${{ steps.package.outputs.package-file }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish trusted artifact
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@huiyun/data-grid
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-artifact

      - name: Verify package digest
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.package-sha256 }}
          PACKAGE_FILE: ${{ needs.verify.outputs.package-file }}
        working-directory: release-artifact
        shell: bash
        run: |
          sha256sum --check "$PACKAGE_FILE.sha256"
          actual_sha256="$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"

      - name: Require an OIDC-capable npm CLI
        run: node -e "const [major = 0, minor = 0, patch = 0] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm 11.5.1 or newer is required');" "$(npm --version)"

      - name: Publish with npm trusted publishing
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          PACKAGE_FILE: ${{ needs.verify.outputs.package-file }}
        run: npm publish "./release-artifact/$PACKAGE_FILE" --access public --ignore-scripts --tag "$DIST_TAG"
